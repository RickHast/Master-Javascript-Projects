<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>

    <form id="form">
        <label for="expense">
            Amout: <input type="number" name="expense" id="amount-input">
        </label>

        <select name="category" id="category-select">
            <option value="food">Food</option>
            <option value="transportation">Transportation</option>
            <option value="accommodation">Accommodation</option>
            <option value="hobbies">Hobbies</option>
            <option value="school">Shcool/Activities</option>
            <option value="other">Other</option>
        </select>

        <textarea id="description" cols="80" rows="10"></textarea>

        <button>Submit</button>
    </form>

    <label for="filter">
        Filter: <select name="filter" id="filter-select"></select>
    </label>

    <h2 id="general-total"></h2>

    <div id="expense-list"></div>

    <script src="models.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
