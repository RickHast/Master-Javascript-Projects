<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <center>
        <h1>Welcome in My Weather Application</h1>
        <p><b>Just enter a city name in the form and valid it</b></p>
        <p><b>Or click on city name in the last 5 searches list</b></p>
        <form id="entry-form">
            <input type="text" placeholder="Enter a city name here" name="cityName">
            <br>
            <button name="send-button">Send</button>
        </form>

        <div id="last-five-output">

        </div>

        <div id="weather-info-output">

        </div>
    </center>

    <script src="script.js"></script>
</body>
</html>
